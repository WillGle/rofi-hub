[workspace]
resolver = "3"
members = [
  "crates/rofi-calendar",
  "crates/rofi-clipboard",
  "crates/rofi-core",
  "crates/rofi-hub",
  "crates/rofi-keybinds",
  "crates/screen-time",
]
default-members = [
  "crates/rofi-calendar",
  "crates/rofi-clipboard",
  "crates/rofi-core",
  "crates/rofi-hub",
  "crates/rofi-keybinds",
  "crates/screen-time",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/WillGle/rofi-hub"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "0.8"

[profile.release]
lto = "thin"
strip = "symbols"
