# Disposable Hyprland fixture for the Keybinds UI checks.
# 45 bindings across six sections, including long exec descriptions.
$mainMod = SUPER

# --- Basic ---
bind = $mainMod, Return, exec, foot
bind = $mainMod, Q, killactive
bind = $mainMod, D, exec, rofi-hub launcher
bind = $mainMod, E, exec, foot yazi
bind = $mainMod, F, togglefloating
bind = $mainMod, V, exec, rofi-hub clipboard
bind = $mainMod, Space, exec, rofi-hub launcher
bind = $mainMod, period, exec, rofi-hub emoji
bind = $mainMod, P, exec, /usr/local/bin/project-dashboard --profile laptop --with-a-deliberately-long-description
bind = $mainMod SHIFT, P, exec, /usr/local/bin/project-dashboard --profile external-display --open-review-queue

# --- Windows ---
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d
bind = $mainMod, Tab, cyclenext,
bind = $mainMod SHIFT, Tab, cyclenext, prev
bind = $mainMod, mouse:272, movewindow
bind = $mainMod, mouse:273, resizewindow

# --- Workspaces ---
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4

# --- Media ---
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bind = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bind = , XF86TouchpadToggle, exec, toggle_touchpad

# --- Screenshots ---
bind = , Print, exec, screenshot region
bind = $mainMod SHIFT, S, exec, screenshot region --copy-to-clipboard --open-editor
bind = $mainMod SHIFT, C, exec, screenshot clip
bind = $mainMod SHIFT, F, exec, screenshot full --include-cursor --delay 3
bind = $mainMod SHIFT, R, exec, screen-rec toggle --audio --webcam-overlay

# --- System ---
bind = $mainMod, L, exec, theme-lock
bind = $mainMod SHIFT, Escape, exec, rofi-hub power
bind = $mainMod, Escape, exec, rofi-hub lock
bind = $mainMod, N, exec, rofi-hub network
bind = $mainMod, C, exec, rofi-hub calendar
bind = $mainMod, W, exec, rofi-hub window
