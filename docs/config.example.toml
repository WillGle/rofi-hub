# Optional configuration for the optional menu. Copy to:
#   ~/.config/rofi-hub-menu/config.toml

[ui]
# prompt = "Rofi Hub"
# font = "JetBrainsMono Nerd Font"
# font_size = 12

[theme]
# auto | nord | solarized | gruvbox | /path/to/theme.rasi
# mode = "gruvbox"

[launcher]
# Columns and visible rows for `rofi-hub-menu launcher` (drun).
# columns is clamped to 1..=6; lines is clamped to 1..=40.
columns = 3
lines = 10
