[package]
name = "rofi-keybinds"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Hyprland keyboard shortcut reference for Rofi"
publish = false

[[bin]]
name = "rofi-keybinds"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
rofi-dmenu = { path = "../rofi-dmenu", default-features = false, features = ["category"] }

[dev-dependencies]
rofi-dmenu = { path = "../rofi-dmenu", default-features = false, features = ["category", "test-support"] }
tempfile = "3"
