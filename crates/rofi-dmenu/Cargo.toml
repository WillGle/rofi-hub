[package]
name = "rofi-dmenu"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Rofi dmenu protocol, theme resolution, paths, and UI helpers for the rofi-apps ecosystem"
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
unicode-width = "0.2"
tempfile = { version = "3", optional = true }
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
tempfile = "3"

[features]
default = ["manifest", "notify", "category"]
manifest = []
notify = []
category = []
test-support = ["dep:tempfile"]
