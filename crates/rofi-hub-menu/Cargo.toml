[package]
name = "rofi-hub-menu"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Optional Rofi menu that lists and launches installed rofi-apps providers"
publish = false

[[bin]]
name = "rofi-hub-menu"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
rofi-dmenu = { path = "../rofi-dmenu", features = ["manifest", "notify"] }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[dev-dependencies]
tempfile = "3"
