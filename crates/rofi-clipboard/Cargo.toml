[package]
name = "rofi-clipboard"
version = "0.8.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Clipboard history picker for cliphist and wl-copy"
publish = false

[[bin]]
name = "rofi-clipboard"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
rofi-dmenu = { path = "../rofi-dmenu", default-features = false, features = ["category"] }

[dev-dependencies]
rofi-dmenu = { path = "../rofi-dmenu", default-features = false, features = ["category", "test-support"] }
tempfile = "3"
