[package]
name = "rofi-calendar"
version = "1.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Month sheet with date search for the Rofi Hub ecosystem"
publish = false

[[bin]]
name = "rofi-calendar"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rofi-dmenu = { path = "../rofi-dmenu", default-features = false, features = ["category"] }

[dev-dependencies]
rofi-dmenu = { path = "../rofi-dmenu", default-features = false, features = ["category", "test-support"] }
tempfile = "3"
