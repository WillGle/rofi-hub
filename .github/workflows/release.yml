name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install shellcheck, minisign, and jq
        run: sudo apt-get update && sudo apt-get install -y shellcheck minisign jq
      - name: Format
        run: cargo fmt --check --all
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy session-count feature
        run: cargo clippy --locked --package screen-time --all-targets --features session-count -- -D warnings
      - name: App sync
        run: python3 scripts/check-app-sync.py
      - name: Packaging sync
        run: python3 scripts/check-packaging-sync.py
      - name: Evaluation charts
        run: python3 crates/screen-time/scripts/render-evaluation-charts.py --check
      - name: Shell scripts
        run: |
          shellcheck install.sh uninstall.sh \
            scripts/build-package-artifacts.sh scripts/package-release.sh scripts/sign-release.sh \
            scripts/test-bundle.sh scripts/test-install-tree.sh scripts/test-installer.sh \
            crates/screen-time/scripts/*.sh \
            crates/screen-time/share/rofi-screen-time packaging/install-tree.sh \
            packaging/openrc/screen-time packaging/runit/screen-time/run \
            packaging/slackbuilds/rofi-hub.SlackBuild

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --locked
      - name: Test session-count feature
        run: cargo test --locked --package screen-time --features session-count --lib

  msrv:
    name: MSRV (1.89)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: "1.89"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --workspace --locked --all-targets

  installer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install minisign and jq
        run: sudo apt-get update && sudo apt-get install -y minisign jq
      - name: Installer integration and fault injection
        env:
          RUSTUP_TOOLCHAIN: stable
        run: scripts/test-installer.sh

  install-tree:
    name: install tree
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install packaging validators
        run: |
          sudo apt-get update
          sudo apt-get install -y systemd desktop-file-utils appstream zsh fish man-db gzip
      - name: Build workspace
        run: cargo build --release --locked --workspace
      - name: Install tree, manifest, unit, desktop, AppStream
        env:
          SKIP_BUILD: "1"
          REQUIRE_LINT: "1"
        run: scripts/test-install-tree.sh
      - name: Packaging sync
        run: python3 scripts/check-packaging-sync.py

  debian-official:
    name: debian-official (dpkg-buildpackage/lintian)
    runs-on: ubuntu-latest
    container: debian:12
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install Debian build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential debhelper ca-certificates curl git pkg-config python3 \
            lintian rofi systemd desktop-file-utils
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
            sh -s -- -y --profile minimal --default-toolchain 1.89.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build Debian binary package
        run: |
          cp -a packaging/debian debian
          dpkg-buildpackage -us -uc -b -d
      - name: Lintian
        run: lintian --fail-on error ../rofi-hub_*.deb
      - name: Install and smoke-test
        run: |
          dpkg -i ../rofi-hub_*.deb
          rofi-hub --version
          rofi-hub list --json | python3 -c 'import json,sys; d={x["id"]:x for x in json.load(sys.stdin)}; assert all(x["available"] for x in d.values()), d; print("debian package ok")'
          systemd-analyze verify /usr/lib/systemd/user/screen-time.service
          apt-get remove -y rofi-hub

  distro-build:
    name: distro-build (${{ matrix.family }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:12
            family: debian
          - image: archlinux:base-devel
            family: arch
          - image: fedora:latest
            family: fedora
          - image: alpine:edge
            family: alpine
          - image: opensuse/tumbleweed
            family: opensuse
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust and build dependencies
        run: |
          set -eux
          case "${{ matrix.family }}" in
            debian)
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                build-essential ca-certificates curl git pkg-config python3 \
                systemd desktop-file-utils appstream zsh fish man-db gzip xz-utils
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
                sh -s -- -y --profile minimal --default-toolchain 1.89.0
              echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
              ;;
            arch)
              pacman -Syu --noconfirm --needed \
                base-devel rust cargo git python systemd desktop-file-utils \
                appstream zsh fish man-db gzip namcap
              ;;
            fedora)
              dnf install -y gcc gcc-c++ make cargo rust git python3 systemd \
                desktop-file-utils appstream zsh fish man-db gzip xz rpm-build rpmlint
              ;;
            alpine)
              apk add --no-cache build-base cargo rust git python3 bash \
                desktop-file-utils zsh fish mandoc gzip abuild
              ;;
            opensuse)
              zypper --non-interactive install -y gcc gcc-c++ make cargo rust git \
                python3 systemd desktop-file-utils zsh fish man gzip xz rpm-build rpmlint
              ;;
          esac
          cargo --version
          rustc --version
      - name: Build
        run: cargo build --release --locked --workspace
      - name: Test
        run: cargo test --workspace --locked
      - name: Stage install tree and runtime smoke
        env:
          SKIP_BUILD: "1"
        run: scripts/test-install-tree.sh
      - name: Package lint
        run: |
          set -eux
          case "${{ matrix.family }}" in
            debian)
              dpkg-parsechangelog -l packaging/debian/changelog >/dev/null
              ;;
            arch)
              namcap packaging/arch/PKGBUILD
              ;;
            fedora)
              rpmlint packaging/fedora/rofi-hub.spec
              ;;
            alpine)
              cd packaging/alpine
              abuild -F validate
              ;;
            opensuse)
              rpmlint packaging/opensuse/rofi-hub.spec
              ;;
          esac

  bundle:
    name: bundle (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
            experimental: true
    runs-on: ${{ matrix.os }}
    container: debian:12
    continue-on-error: ${{ matrix.experimental || false }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git pkg-config python3 xz-utils rpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Record glibc baseline
        run: ldd --version | head -n1
      - name: Package release bundle
        env:
          ARCH: ${{ matrix.arch }}
        run: scripts/package-release.sh
      - name: Smoke-test release bundle
        env:
          ARCH: ${{ matrix.arch }}
        run: scripts/test-bundle.sh "dist/rofi-hub-${ARCH}-linux.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: rofi-hub-${{ matrix.arch }}
          path: |
            dist/rofi-hub-${{ matrix.arch }}-linux.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

  artifacts:
    name: packages (.deb/.rpm)
    runs-on: ubuntu-latest
    container: debian:12
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git pkg-config python3 xz-utils
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install nfpm
        run: |
          curl -fsSL -o /tmp/nfpm.deb \
            https://github.com/goreleaser/nfpm/releases/download/v2.46.3/nfpm_2.46.3_amd64.deb
          dpkg -i /tmp/nfpm.deb
          nfpm --version
      - name: Build workspace
        run: cargo build --release --locked --workspace
      - name: Build packages
        env:
          SKIP_BUILD: "1"
          SKIP_APK: "1"
        run: scripts/build-package-artifacts.sh
      - name: Validate packages
        env:
          ALLOW_PARTIAL: "1"
        run: scripts/test-package-artifacts.sh
      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS.packages
          if-no-files-found: error

  apk-package:
    name: package (.apk via abuild)
    runs-on: ubuntu-latest
    container: alpine:edge
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install Alpine build tools
        run: apk add --no-cache alpine-sdk cargo rust bash fakeroot tzdata python3
      - name: Build source asset and APK
        run: |
          set -eux
          VERSION=$(sed -n '/^\[workspace.package\]/,/^\[/p' Cargo.toml | sed -n 's/^version = "\(.*\)"/\1/p' | head -n1)
          scripts/package-source.sh
          adduser -D -s /bin/sh builder
          mkdir -p /tmp/srcdest
          cp "dist/rofi-hub-$VERSION-source.tar.gz" "/tmp/srcdest/rofi-hub-$VERSION.tar.gz"
          chown -R builder:builder "$PWD" /tmp/srcdest
          su builder -c 'abuild-keygen -a -n'
          cp /home/builder/.config/abuild/*.rsa.pub /etc/apk/keys/
          chmod 644 /etc/apk/keys/*.rsa.pub
          su builder -c "cd '$PWD/packaging/alpine' && abuild -r -d -s /tmp/srcdest"
          find /home/builder/.local/share/abuild -name "rofi-hub-$VERSION-r*.apk" -exec cp {} "dist/rofi-hub-$VERSION-r0.apk" \;
          test -f "dist/rofi-hub-$VERSION-r0.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: apk
          path: dist/rofi-hub-*-r0.apk
          if-no-files-found: error

  release-smoke:
    name: release-smoke (${{ matrix.family }})
    needs: [artifacts, apk-package]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:12
            family: debian
            artifact: deb
          - image: fedora:latest
            family: fedora
            artifact: rpm
          - image: opensuse/tumbleweed
            family: opensuse
            artifact: rpm
          - image: alpine:edge
            family: alpine
            artifact: apk
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: /tmp/artifacts
      - uses: actions/download-artifact@v8
        with:
          name: apk
          path: /tmp/artifacts
      - name: Install dependencies and package
        run: |
          set -eux
          case "${{ matrix.family }}" in
            debian)
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                rofi bash python3 systemd desktop-file-utils
              dpkg -i /tmp/artifacts/*.deb
              ;;
            fedora)
              dnf install -y rofi bash python3 systemd desktop-file-utils
              dnf install -y /tmp/artifacts/*.rpm
              ;;
            opensuse)
              zypper --non-interactive install -y rofi bash python3 systemd desktop-file-utils
              zypper --non-interactive install -y --allow-unsigned-rpm /tmp/artifacts/*.rpm
              ;;
            alpine)
              apk add --no-cache rofi bash python3
              apk add --allow-untrusted /tmp/artifacts/*.apk
              ;;
          esac
      - name: Runtime smoke
        run: |
          set -eux
          rofi-hub --version
          rofi-hub list --json > /tmp/providers.json
          python3 - <<'PY'
          import json
          items = {item["id"]: item for item in json.load(open("/tmp/providers.json"))}
          assert set(items) == {"calendar", "clipboard", "keybinds", "screen-time"}, items
          assert all(item["available"] for item in items.values()), items
          print("providers ok:", ", ".join(sorted(items)))
          PY
          screen-time --version
          test -f /usr/share/rofi-hub/themes/hub.rasi
          test -f /usr/share/rofi/screen-time.rasi
          test -x /usr/bin/rofi-screen-time
          if command -v systemd-analyze >/dev/null 2>&1; then
            systemd-analyze verify /usr/lib/systemd/user/screen-time.service
          fi
      - name: Remove package
        run: |
          set -eux
          case "${{ matrix.family }}" in
            debian) apt-get remove -y rofi-hub ;;
            fedora) dnf remove -y rofi-hub ;;
            opensuse) zypper --non-interactive remove -y rofi-hub ;;
            alpine) apk del rofi-hub ;;
          esac
          if command -v rofi-hub; then
            echo "rofi-hub is still in PATH after removal" >&2
            exit 1
          fi
          test ! -e /usr/share/rofi-hub
          test ! -e /usr/share/rofi/screen-time.rasi

  nix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v32
      - name: Flake check
        run: nix flake check --no-write-lock-file
      - name: Build all-in-one
        run: nix build .# --no-write-lock-file
      - name: Smoke-test Nix package
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess
          import tomllib

          providers = {
              path.stem: tomllib.loads(path.read_text())
              for path in pathlib.Path("providers").glob("*.toml")
          }
          out = subprocess.run(
              ["./result/bin/rofi-hub", "list", "--json"],
              capture_output=True,
              text=True,
              check=True,
          )
          listed = {item["id"]: item for item in json.loads(out.stdout)}
          assert set(listed) == set(providers), (sorted(listed), sorted(providers))
          assert all(item["available"] for item in listed.values()), listed
          print(f"nix package ok: {len(listed)} providers")
          PY
      - name: Workflow lint
        run: nix shell nixpkgs#actionlint -c actionlint

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    # Phase A release: Nix native packages + install.sh only. Distro package
    # jobs are validated separately and do not gate the native release.
    needs:
      - lint
      - test
      - msrv
      - installer
      - bundle
      - nix
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Build release assets
        run: |
          set -euo pipefail
          mkdir -p assets
          mv dist/rofi-hub-*.tar.gz assets/
          cp install.sh uninstall.sh minisign.pub assets/
          cd assets
          sha256sum ./rofi-hub-*.tar.gz install.sh uninstall.sh minisign.pub > SHA256SUMS
          cat SHA256SUMS
      - name: Sign release metadata
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          [ -n "$MINISIGN_SECRET_KEY" ] || { echo "MINISIGN_SECRET_KEY is not configured" >&2; exit 1; }
          key="$RUNNER_TEMP/minisign.key"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          chmod 600 "$key"
          MINISIGN_SECRET_KEY="$key" scripts/sign-release.sh assets
      - name: Verify release assets
        run: |
          set -euo pipefail
          minisign -Vm assets/SHA256SUMS -p minisign.pub
          minisign -Vm assets/install.sh -p minisign.pub
          (cd assets && sha256sum -c SHA256SUMS)
      - uses: softprops/action-gh-release@v3
        with:
          files: assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
