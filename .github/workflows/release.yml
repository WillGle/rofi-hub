name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install shellcheck and minisign
        run: sudo apt-get update && sudo apt-get install -y shellcheck minisign
      - name: Format
        run: cargo fmt --check --all
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy session-count feature
        run: cargo clippy --locked --package screen-time --all-targets --features session-count -- -D warnings
      - name: Dependency guard
        run: python3 scripts/check-deps.py
      - name: App sync
        run: python3 scripts/check-app-sync.py
      - name: Shell scripts
        run: |
          shellcheck install.sh uninstall.sh \
            scripts/package-release.sh scripts/sign-release.sh \
            scripts/test-apps.sh scripts/test-bundle.sh scripts/test-installer.sh \
            scripts/test-install-matrix.sh scripts/test-migration.sh \
            scripts/test-nix.sh scripts/test-release-index.sh scripts/test-theme.sh \
            crates/screen-time/scripts/*.sh \
            crates/screen-time/share/rofi-screen-time

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --locked
      - name: Test session-count feature
        run: cargo test --locked --package screen-time --features session-count --lib

  msrv:
    name: MSRV (1.89)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: "1.89"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --workspace --locked --all-targets

  installer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Installer integration and fault injection
        env:
          RUSTUP_TOOLCHAIN: stable
        run: scripts/test-installer.sh
      - name: Release index schema and signatures
        run: scripts/test-release-index.sh
      - name: App runtime and menu integration
        run: |
          cargo build --workspace
          scripts/test-apps.sh
          scripts/test-theme.sh
      - name: Migration fixture
        run: scripts/test-migration.sh
      - name: Startup performance budget
        run: |
          cargo build --release --workspace
          scripts/test-performance.sh

  bundle:
    name: bundle (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Build per-app release artifacts
        env:
          ARCH: ${{ matrix.arch }}
          DIST: dist
        run: scripts/package-release.sh
      - name: Bundle check through install.sh
        run: |
          cp -a dist dist-check
          scripts/test-bundle.sh dist-check
      - name: Upload release artifacts
        uses: actions/upload-artifact@v5
        with:
          name: rofi-apps-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/index-${{ matrix.arch }}.json
            dist/SHA256SUMS
            dist/install.sh
            dist/uninstall.sh
            dist/minisign.pub
          if-no-files-found: error

  cross-distro:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: install.sh matrix (Debian/Ubuntu/Arch/Fedora)
        run: |
          if [ -z "${ROFI_APPS_SKIP_MATRIX:-}" ]; then
            scripts/test-install-matrix.sh
          fi

  nix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v32
      - name: Flake check and per-app closures
        run: scripts/test-nix.sh
      - name: Workflow lint
        run: nix shell nixpkgs#actionlint -c actionlint

  nix-arm:
    name: NIX-07 native aarch64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v32
      - name: Build every app natively on aarch64
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          for app in rofi-calendar rofi-clipboard rofi-keybinds rofi-network screen-time rofi-hub-menu; do
            out="$(nix build --no-link --print-out-paths ".#$app")"
            echo "built $app: $out"
            nix path-info -rSh "$out" | sed "s/^/closure $app: /"
          done

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - lint
      - test
      - msrv
      - installer
      - bundle
      - cross-distro
      - nix
      - nix-arm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Assemble release assets
        run: |
          set -euo pipefail
          mkdir -p assets
          cp dist/*.tar.gz assets/
          cp dist/install.sh dist/uninstall.sh dist/minisign.pub assets/
          # Both native bundles publish index-<arch>.json. Merge them so the
          # installer can select the tarball that matches the host.
          python3 scripts/merge-release-index.py assets/index.json dist/index-*.json
          (cd assets && sha256sum ./*.tar.gz index.json install.sh uninstall.sh minisign.pub >SHA256SUMS)
          cat assets/SHA256SUMS
      - name: Verify per-architecture mapping
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          index = json.loads(pathlib.Path("assets/index.json").read_text())
          assert index["schema"] == 2, index["schema"]
          assert index["architectures"] == ["aarch64", "x86_64"], index["architectures"]
          for entry in index["apps"]:
              for arch in ("x86_64", "aarch64"):
                  assert f"url_{arch}" in entry, (entry["id"], arch)
                  assert f"sha256_{arch}" in entry, (entry["id"], arch)
          print(f"index maps {len(index['apps'])} apps to both architectures")
          PY
      - name: Sign release artifacts
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          [ -n "$MINISIGN_SECRET_KEY" ] || { echo "MINISIGN_SECRET_KEY is not configured" >&2; exit 1; }
          key="$RUNNER_TEMP/minisign.key"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          chmod 600 "$key"
          MINISIGN_SECRET_KEY="$key" scripts/sign-release.sh assets
      - name: Verify release artifacts
        run: |
          set -euo pipefail
          minisign -Vm assets/index.json -p minisign.pub
          for archive in assets/*.tar.gz; do
            minisign -Vm "$archive" -p minisign.pub
          done
          (cd assets && sha256sum -c SHA256SUMS)
      - uses: softprops/action-gh-release@v3
        with:
          files: assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
