name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install shellcheck, minisign, and jq
        run: sudo apt-get update && sudo apt-get install -y shellcheck minisign jq
      - name: Format
        run: cargo fmt --check --all
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy session-count feature
        run: cargo clippy --locked --package screen-time --all-targets --features session-count -- -D warnings
      - name: App sync
        run: python3 scripts/check-app-sync.py
      - name: Evaluation charts
        run: python3 crates/screen-time/scripts/render-evaluation-charts.py --check
      - name: Shell scripts
        run: shellcheck install.sh uninstall.sh scripts/*.sh crates/screen-time/scripts/*.sh crates/screen-time/share/rofi-screen-time

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --locked
      - name: Test session-count feature
        run: cargo test --locked --package screen-time --features session-count --lib

  msrv:
    name: MSRV (1.89)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: "1.89"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --workspace --locked --all-targets

  installer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install minisign and jq
        run: sudo apt-get update && sudo apt-get install -y minisign jq
      - name: Installer integration and fault injection
        env:
          RUSTUP_TOOLCHAIN: stable
        run: scripts/test-installer.sh

  bundle:
    name: bundle (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental || false }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Package release bundle
        env:
          ARCH: ${{ matrix.arch }}
        run: scripts/package-release.sh
      - name: Smoke-test release bundle
        env:
          ARCH: ${{ matrix.arch }}
        run: scripts/test-bundle.sh "dist/rofi-hub-${ARCH}-linux.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: rofi-hub-${{ matrix.arch }}
          path: |
            dist/rofi-hub-${{ matrix.arch }}-linux.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

  nix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v32
      - name: Flake check
        run: nix flake check --no-write-lock-file
      - name: Build all-in-one
        run: nix build .# --no-write-lock-file
      - name: Smoke-test Nix package
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess
          import tomllib

          providers = {
              path.stem: tomllib.loads(path.read_text())
              for path in pathlib.Path("providers").glob("*.toml")
          }
          out = subprocess.run(
              ["./result/bin/rofi-hub", "list", "--json"],
              capture_output=True,
              text=True,
              check=True,
          )
          listed = {item["id"]: item for item in json.loads(out.stdout)}
          assert set(listed) == set(providers), (sorted(listed), sorted(providers))
          assert all(item["available"] for item in listed.values()), listed
          print(f"nix package ok: {len(listed)} providers")
          PY
      - name: Workflow lint
        run: nix shell nixpkgs#actionlint -c actionlint

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test, msrv, installer, bundle, nix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Build release assets
        run: |
          set -euo pipefail
          mkdir -p assets
          mv dist/rofi-hub-*.tar.gz assets/
          cp install.sh uninstall.sh minisign.pub assets/
          cd assets
          sha256sum rofi-hub-*.tar.gz install.sh uninstall.sh minisign.pub > SHA256SUMS
          cat SHA256SUMS
      - name: Sign release metadata
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          [ -n "$MINISIGN_SECRET_KEY" ] || { echo "MINISIGN_SECRET_KEY is not configured" >&2; exit 1; }
          key="$RUNNER_TEMP/minisign.key"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          chmod 600 "$key"
          MINISIGN_SECRET_KEY="$key" scripts/sign-release.sh assets
      - name: Verify release assets
        run: |
          set -euo pipefail
          minisign -Vm assets/SHA256SUMS -p minisign.pub
          minisign -Vm assets/install.sh -p minisign.pub
          (cd assets && sha256sum -c SHA256SUMS)
      - uses: softprops/action-gh-release@v3
        with:
          files: assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
